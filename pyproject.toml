[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bjx-ipo-engine"
version = "0.2.0a8"
description = "Beijing Stock Exchange IPO scenario, cash ledger and public evidence research"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/research-workbench-MIT.txt"]
readme = "README.md"
authors = [{name = "KILING-TASI"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf==6.14.2"]

[project.urls]
Repository = "https://github.com/KILING-TASI/bjx-ipo-engine"

[tool.setuptools]
py-modules = ["api", "audit", "bjx", "comparison", "engine", "history", "public_sample", "research", "sample_validation", "trading_calendar"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["vendor*"]

[tool.setuptools.data-files]
"share/bjx-ipo-engine" = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DISCLAIMER.md"]
"share/bjx-ipo-engine/licenses" = ["licenses/research-workbench-MIT.txt"]
