name: Tests and portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pypdf==6.14.2
      - run: python -m unittest discover -s tests -v
      - run: python engine.py examples/scenarios.json
      - run: python research.py facts examples/facts.json
      - run: python research.py ledger examples/ledger.json
      - run: python .github/scripts/check_docs.py
      - run: python .github/scripts/check_package.py
